<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Solana Radar</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="styles.css?v=20260730-workflow-model-1">
  </head>
  <body>
    <header class="topbar">
      <div class="brand-lockup">
        <div class="brand-mark" aria-hidden="true">SR</div>
        <div>
          <h1>Solana Radar</h1>
          <p id="subtitle">Loading latest scan</p>
        </div>
      </div>
      <div class="actions">
        <button id="runScan" type="button">Run scan</button>
        <button id="refresh" type="button">Refresh</button>
      </div>
    </header>

    <main>
      <section class="overview-band" aria-label="Scanner overview">
        <div class="status-row" id="statusRow"></div>
        <div class="metrics" id="metrics"></div>
      </section>

      <section class="toolbar">
        <div class="tabs" role="tablist">
          <button class="tab is-active" data-tab="filters" type="button">Radar</button>
          <button class="tab" data-tab="tokens" type="button">Tokens</button>
          <button class="tab" data-tab="narratives" type="button">Narratives</button>
          <button class="tab" data-tab="alerts" type="button">Events</button>
        </div>
        <div class="filters">
          <label class="search-control">
            <span class="visually-hidden">Search tokens and wallets</span>
            <input id="searchInput" type="search" placeholder="Search token or wallet">
          </label>
          <button class="filter-toggle" id="filterToggle" type="button" aria-expanded="false">Filters</button>
          <div class="advanced-filters" id="advancedFilters">
            <label class="field-control">
              <span class="visually-hidden">Workflow</span>
              <select id="workflowFilter" aria-label="Workflow">
              <option value="new_signals">new signals</option>
              <option value="holding">holding</option>
              <option value="needs_attention">needs attention</option>
              <option value="closed">closed</option>
              <option value="all">all</option>
              </select>
            </label>
            <label class="field-control current-signal-control">
              <span class="visually-hidden">Current signal strength</span>
              <select id="signalFilter" aria-label="Current signal strength">
              <option value="all">all signal strength</option>
              <option value="actionable">strong signal</option>
              <option value="hot_reactivation">fast move</option>
              <option value="watch">watch</option>
              </select>
            </label>
            <label class="field-control current-signal-control">
              <span class="visually-hidden">Current social heat</span>
              <select id="heatFilter" aria-label="Current social heat">
              <option value="all">all current social</option>
              <option value="unchecked">not checked</option>
              <option value="disabled">disabled</option>
              <option value="none">no mentions</option>
              <option value="quiet">quiet</option>
              <option value="warming">warming</option>
              <option value="hot">hot</option>
              </select>
            </label>
            <label class="score-control current-signal-control">
              <span>Current score</span>
              <input id="scoreInput" type="number" min="0" max="100" value="0" aria-label="Minimum current score">
            </label>
            <label class="toggle-filter">
              <input id="showHiddenInput" type="checkbox">
              Deleted
            </label>
          </div>
        </div>
      </section>

      <section id="content" class="content"></section>
    </main>

    <script src="config.js?v=20260730-workflow-model-1"></script>
    <script src="app.js?v=20260730-workflow-model-1"></script>
  </body>
</html>
