<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Solana Radar</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="styles.css?v=20260807-wallet-edge-1">
  </head>
  <body>
    <header class="topbar">
      <div class="brand-lockup">
        <div class="brand-mark" aria-hidden="true">SR</div>
        <div>
          <h1>Solana Radar</h1>
          <p id="subtitle">Loading latest scan</p>
        </div>
      </div>
      <div class="actions">
        <button id="runScan" type="button">Run scan</button>
        <button id="refresh" type="button">Refresh</button>
      </div>
    </header>

    <main>
      <section class="overview-band" aria-label="Scanner overview">
        <div class="status-row" id="statusRow"></div>
        <div class="metrics" id="metrics"></div>
      </section>

      <section class="toolbar">
        <div class="tabs" role="tablist">
          <button class="tab is-active" data-tab="filters" id="tab-radar" type="button" role="tab" aria-selected="true" aria-controls="dashboardContent">Radar</button>
          <button class="tab" data-tab="tokens" id="tab-tokens" type="button" role="tab" aria-selected="false" aria-controls="dashboardContent">Tokens</button>
          <button class="tab" data-tab="narratives" id="tab-narratives" type="button" role="tab" aria-selected="false" aria-controls="dashboardContent">Narratives</button>
          <button class="tab" data-tab="intelligence" id="tab-intelligence" type="button" role="tab" aria-selected="false" aria-controls="dashboardContent">Learning</button>
          <button class="tab" data-tab="alerts" id="tab-events" type="button" role="tab" aria-selected="false" aria-controls="dashboardContent">Events</button>
        </div>
        <div class="filters">
          <label class="search-control">
            <span class="visually-hidden">Search tokens and wallets</span>
            <input id="searchInput" type="search" placeholder="Search token or wallet">
          </label>
          <button class="filter-toggle" id="filterToggle" type="button" aria-expanded="false">Filters</button>
          <div class="advanced-filters" id="advancedFilters">
            <label class="field-control">
              <span class="visually-hidden">Workflow</span>
              <select id="workflowFilter" aria-label="Workflow">
              <option value="active">active</option>
              <option value="hot">hot</option>
              <option value="watch">watch</option>
              <option value="weakening">weakening</option>
              <option value="inactive">inactive</option>
              <option value="all">all</option>
              </select>
            </label>
            <label class="field-control current-signal-control">
              <span class="visually-hidden">Current social heat</span>
              <select id="heatFilter" aria-label="Current social heat">
              <option value="all">all current social</option>
              <option value="unchecked">not checked</option>
              <option value="disabled">disabled</option>
              <option value="none">no mentions</option>
              <option value="quiet">quiet</option>
              <option value="warming">warming</option>
              <option value="hot">hot</option>
              </select>
            </label>
            <label class="score-control current-signal-control">
              <span>Current score</span>
              <input id="scoreInput" type="number" min="0" max="100" value="0" aria-label="Minimum current score">
            </label>
            <label class="toggle-filter">
              <input id="showHiddenInput" type="checkbox">
              Deleted
            </label>
          </div>
        </div>
      </section>

      <section id="content" class="content" role="tabpanel" aria-live="polite" aria-labelledby="tab-radar"></section>
    </main>

    <script src="config.js?v=20260807-wallet-edge-1"></script>
    <script type="module" src="app.js?v=20260813-current-filter-scope-1"></script>
  </body>
</html>
