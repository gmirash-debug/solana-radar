name: Scan and deploy dashboard

on:
  workflow_dispatch:
    inputs:
      source:
        description: "Who triggered the scan"
        required: false
        default: "manual"
      dispatch_bucket:
        description: "Cloudflare scheduler bucket"
        required: false
        default: "manual"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/scan-and-pages.yml"
      - "scanner.py"
      - "package.json"
      - "package-lock.json"
      - "config.example.json"
      - "config.json"
      - "requirements.txt"
      - "tests/**"
      - "tools/build_pages.py"
      - "dashboard/**"
      - "cloudflare/**"
      - "NARRATIVE_PROTOCOL.md"
      - "SUPPLY_INTEGRITY_PROTOCOL.md"

concurrency:
  # Cloudflare Worker cron is the single scheduled scan source; runs share one
  # runtime-state writer lock. UI-only pushes use their own queue so discovery
  # cannot continually replace pending publications.
  group: ${{ github.event_name == 'push' && 'solana-radar-ui-publish' || 'solana-radar-state-writer' }}
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    outputs:
      pages_ready: ${{ steps.pages_artifact.outcome == 'success' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Sync latest main
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git pull --ff-only origin main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check scan freshness
        id: freshness
        env:
          RADAR_DATA_API_URL: https://solana-radar-scan-dispatcher.gmirash-solana-radar.workers.dev
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import os
          from datetime import datetime, timezone
          from urllib.request import urlopen

          event_name = os.environ.get("GITHUB_EVENT_NAME", "")
          event = {}
          scanner_status = {}
          try:
              with open(os.environ.get("GITHUB_EVENT_PATH", ""), "r", encoding="utf-8") as handle:
                  event = json.load(handle)
          except Exception:
              pass
          dispatch_source = (event.get("inputs") or {}).get("source", "")
          if event_name == "workflow_dispatch" and not dispatch_source.startswith("cloudflare-"):
              print("should_scan=true")
              print("reason=manual_dispatch")
              raise SystemExit
          if event_name == "push":
              print("should_scan=false")
              print("reason=push_deploy_only")
              raise SystemExit

          report = {}
          try:
              base_url = os.environ.get("RADAR_DATA_API_URL", "").rstrip("/")
              with urlopen(f"{base_url}/api/dashboard?history_limit=1", timeout=10) as response:
                  payload = json.load(response)
              if payload.get("ok"):
                  report = payload.get("report") or {}
                  scanner_status = payload.get("scan_status") or {}
          except Exception:
              # A first deployment or temporary Worker outage should trigger a scan,
              # not make Git-tracked runtime JSON the source of truth again.
              report = {}

          try:
              generated_at = report.get("generated_at", "")
              generated = datetime.fromisoformat(generated_at.replace("Z", "+00:00"))
              age_seconds = (datetime.now(timezone.utc) - generated).total_seconds()
          except Exception:
              print("should_scan=true")
              print("reason=missing_remote_report")
              raise SystemExit

          try:
              last_attempt = datetime.fromisoformat(
                  str(scanner_status.get("last_attempt_at", "")).replace("Z", "+00:00")
              )
              failed_age_seconds = (datetime.now(timezone.utc) - last_attempt).total_seconds()
              error_categories = (
                  scanner_status.get("scan_health", {}).get("scan_error_categories", {})
              )
              status_error = str(scanner_status.get("error") or "").lower()
              provider_blocked = any(
                  error_categories.get(key)
                  for key in ("rpc_all_unavailable",)
              ) or any(
                  marker in status_error
                  for marker in (
                      "all rpc provider",
                      "max usage",
                      "rate_limit",
                      "rate limit",
                      "quota",
                      "credit",
                      "http 401",
                      "http 403",
                      "unauthorized",
                      "forbidden",
                      "invalid api key",
                      "api_key is missing",
                      "api key is missing",
                      "missing api key",
                      "auth:",
                  )
              )
          except Exception:
              failed_age_seconds = None
              provider_blocked = False

          if (
              scanner_status.get("status") == "failed"
              and provider_blocked
              and failed_age_seconds is not None
              and failed_age_seconds < 6 * 60 * 60
          ):
              print("should_scan=false")
              print(f"reason=provider_backoff_{int(failed_age_seconds)}s")
              raise SystemExit

          if age_seconds < 50 * 60:
              print("should_scan=false")
              print(f"reason=fresh_{event_name}_{int(age_seconds)}s")
          else:
              print("should_scan=true")
              print(f"reason=stale_{event_name}_{int(age_seconds)}s")
          PY

      - name: Skip fresh scheduled scan
        if: steps.freshness.outputs.should_scan != 'true'
        run: |
          echo "Skipping scanner because latest report is still fresh: ${{ steps.freshness.outputs.reason }}"

      - name: Restore scanner runtime state
        if: steps.freshness.outputs.should_scan == 'true'
        uses: actions/cache/restore@v4
        with:
          path: |
            data/state.json
            data/discovery_state.json
            data/discovery_status.json
          key: ${{ runner.os }}-solana-radar-state-v4-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-solana-radar-state-v4-

      - name: Preserve pending cloud writes
        if: steps.freshness.outputs.should_scan == 'true'
        uses: actions/cache/restore@v4
        with:
          path: data/remote_outbox
          key: ${{ runner.os }}-solana-radar-outbox-v1-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-solana-radar-outbox-v1-

      - name: Install dependencies
        if: steps.freshness.outputs.should_scan == 'true' || github.event_name == 'push'
        run: |
          python -m pip install -r requirements.txt
          npm install -g gmgn-cli@1.5.4

      - name: Validate scanner and dashboard
        if: steps.freshness.outputs.should_scan == 'true' || github.event_name == 'push'
        run: |
          python -m unittest discover -s tests -v
          python -m json.tool config.example.json > /dev/null
          node --test cloudflare/scan-dispatcher/test/index.test.mjs dashboard/test/data-source.test.mjs dashboard/test/token-state.test.mjs dashboard/test/filter-scope.test.mjs
          node --check dashboard/app.js

      - name: Run scanner
        id: run_scanner
        if: steps.freshness.outputs.should_scan == 'true'
        env:
          HELIUS_API_KEY: ${{ secrets.HELIUS_API_KEY }}
          ALCHEMY_SOLANA_RPC_URL: ${{ secrets.ALCHEMY_SOLANA_RPC_URL }}
          ALCHEMY_API_KEY: ${{ secrets.ALCHEMY_API_KEY }}
          CHAINSTACK_SOLANA_RPC_URL: ${{ secrets.CHAINSTACK_SOLANA_RPC_URL }}
          DRPC_SOLANA_RPC_URL: ${{ secrets.DRPC_SOLANA_RPC_URL }}
          DRPC_API_KEY: ${{ secrets.DRPC_API_KEY }}
          PUBLICNODE_SOLANA_RPC_URL: https://solana-rpc.publicnode.com
          GMGN_API_KEY: ${{ secrets.GMGN_API_KEY }}
          BRIGHTDATA_API_KEY: ${{ secrets.BRIGHTDATA_API_KEY }}
          RADAR_DATA_API_URL: https://solana-radar-scan-dispatcher.gmirash-solana-radar.workers.dev
          RADAR_INGEST_SECRET: ${{ secrets.RADAR_INGEST_SECRET }}
          # D1 is canonical; the compact Pages snapshot remains available if
          # the remote write is temporarily unavailable.
          RADAR_REMOTE_SYNC_REQUIRED: "false"
        run: |
          set +e
          timeout --signal=TERM --kill-after=30s 25m python scanner.py --once --lane reactivation
          status=$?
          if [ "$status" = "124" ]; then
            python - <<'PY'
          import scanner

          scanner.write_scanner_status(
              "failed",
              error=TimeoutError("scanner exceeded the 25 minute workflow limit"),
          )
          PY
          fi
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          if [ "$status" -ne 0 ]; then
            echo "::warning title=Scanner failed::scanner.py exited with $status; keeping the previous dashboard snapshot"
            {
              echo "### Scanner attempt failed"
              echo ""
              echo "The previous successful dashboard snapshot was kept. See data/scanner_status.json for the current failure reason."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          # Scanner failures are represented in scanner_status.json. Keeping this
          # step green lets the failure be classified, committed, and published below.
          exit 0

      - name: Classify scanner failure
        id: failure_taxonomy
        if: steps.freshness.outputs.should_scan == 'true'
        env:
          SCAN_EXIT_CODE: ${{ steps.run_scanner.outputs.exit_code }}
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import os
          from pathlib import Path
          import scanner

          try:
              status = json.loads(Path("data/scanner_status.json").read_text())
          except Exception:
              status = {}
          classification = scanner.scanner_failure_class(
              status,
              int(os.environ.get("SCAN_EXIT_CODE") or 1),
          )
          print(f"classification={classification}")
          PY

      - name: Save pending cloud writes
        if: always() && steps.freshness.outputs.should_scan == 'true'
        uses: actions/cache/save@v4
        with:
          path: data/remote_outbox
          key: ${{ runner.os }}-solana-radar-outbox-v1-${{ github.run_id }}

      - name: Save scanner runtime state
        if: steps.freshness.outputs.should_scan == 'true' && steps.run_scanner.outputs.exit_code == '0'
        uses: actions/cache/save@v4
        with:
          path: |
            data/state.json
            data/discovery_state.json
            data/discovery_status.json
          key: ${{ runner.os }}-solana-radar-state-v4-${{ github.run_id }}

      - name: Build Pages artifact
        if: steps.freshness.outputs.should_scan == 'true' || github.event_name == 'push'
        run: |
          git fetch origin main
          git archive FETCH_HEAD dashboard | tar -x
          rm -rf .pages
          mkdir -p .pages/data
          cp dashboard/index.html dashboard/app.js dashboard/data-source.js dashboard/token-state.js dashboard/filter-scope.js dashboard/styles.css dashboard/config.js .pages/
          python tools/build_pages.py

      - name: Configure Pages
        if: steps.freshness.outputs.should_scan == 'true' || github.event_name == 'push'
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        id: pages_artifact
        if: steps.freshness.outputs.should_scan == 'true' || github.event_name == 'push'
        uses: actions/upload-pages-artifact@v3
        with:
          # A unique name prevents a stale Pages artifact from another queued
          # run being selected by the deployment job.
          name: solana-radar-pages-${{ github.run_id }}
          path: .pages

      - name: Fail hard scanner errors after publishing status
        if: steps.freshness.outputs.should_scan == 'true' && steps.failure_taxonomy.outputs.classification == 'hard_failure'
        run: |
          echo "Scanner failed with a programming, invariant, or corrupted-state error."
          exit 1

  deploy:
    if: always() && github.ref == 'refs/heads/main' && needs.scan.outputs.pages_ready == 'true'
    needs: scan
    runs-on: ubuntu-latest
    concurrency:
      group: solana-radar-pages-deployment
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: solana-radar-pages-${{ github.run_id }}
