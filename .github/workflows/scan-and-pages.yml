name: Scan and deploy dashboard
run-name: "Scan and deploy dashboard [source=${{ github.event_name == 'workflow_dispatch' && (inputs.source || 'manual') || github.event_name }}]"

on:
  schedule:
    - cron: "41 */6 * * *"
  workflow_dispatch:
    inputs:
      source:
        description: "Source: manual-ui, manual-targeted, publication-recovery (saved dashboard only), or manual"
        required: false
        default: "manual"
      dispatch_bucket:
        description: "Cloudflare scheduler bucket"
        required: false
        default: "manual"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/scan-and-pages.yml"
      - "scanner.py"
      - "coordinated_activity.py"
      - "wallet_links.py"
      - "robinhood.py"
      - "robinhood_store.py"
      - "gmgn_context.py"
      - "relay_context.py"
      - "position_evidence.py"
      - "solana_position_lineage.py"
      - "runtime_checkpoint.py"
      - "cold_outbox.py"
      - "runtime_dashboard.py"
      - "history_contract.py"
      - "rpc_budget.py"
      - "rpc_routing.py"
      - "rpc_limiter.py"
      - "balance_batch.py"
      - "scan_scheduling.py"
      - "scan_failure.py"
      - "launch_history.py"
      - "position_history_rpc.py"
      - "wallet_activity.py"
      - "prospective_evidence.py"
      - "signal_evaluation.py"
      - "lifi_context.py"
      - "package.json"
      - "package-lock.json"
      - "config.example.json"
      - "config.json"
      - "requirements.txt"
      - "tests/**"
      - "tools/build_pages.py"
      - "tools/runtime_cache.py"
      - "tools/flush_history_queue.py"
      - "tools/workflow_plan.py"
      - "tools/recover_runtime_publication.py"
      - ".github/workflows/discovery-pulse.yml"
      - ".github/workflows/scan-watchdog.yml"
      - "tools/scan_watchdog.py"
      - "dashboard/**"
      - "cloudflare/**"
      - "NARRATIVE_PROTOCOL.md"
      - "SUPPLY_INTEGRITY_PROTOCOL.md"

concurrency:
  # Cloudflare Worker cron is the single scheduled scan source; runs share one
  # runtime-state writer lock. Only read-only UI publications have their own
  # queue; component locks require partitioned/versioned mutable state first.
  group: ${{ (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.source == 'manual-ui')) && 'solana-radar-ui-publish' || 'solana-radar-state-writer' }}
  cancel-in-progress: false

permissions:
  actions: read
  contents: write
  pages: write
  id-token: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      pages_ready: ${{ steps.pages_artifact.outcome == 'success' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Sync latest main
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git pull --ff-only origin main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Plan bounded publication work
        id: plan
        run: python tools/workflow_plan.py >> "$GITHUB_OUTPUT"

      - name: Check scan freshness
        id: freshness
        env:
          RADAR_DATA_API_URL: https://solana-radar-scan-dispatcher.gmirash-solana-radar.workers.dev
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import os
          from datetime import datetime, timezone
          from urllib.request import urlopen
          from scan_scheduling import scan_freshness_reference
          from scan_failure import scanner_failure_class

          event_name = os.environ.get("GITHUB_EVENT_NAME", "")
          event = {}
          scanner_status = {}
          try:
              with open(os.environ.get("GITHUB_EVENT_PATH", ""), "r", encoding="utf-8") as handle:
                  event = json.load(handle)
          except Exception:
              pass
          dispatch_source = (event.get("inputs") or {}).get("source", "")
          if event_name == "schedule":
              print("should_scan=false")
              print("reason=storage_recovery_only")
              raise SystemExit
          targeted = dispatch_source == "cloudflare-targeted"
          if event_name == "workflow_dispatch" and dispatch_source in ("robinhood", "manual-ui", "publication-recovery", "storage-recovery"):
              print("should_scan=false")
              print(f"reason={dispatch_source}_only")
              raise SystemExit
          if event_name == "workflow_dispatch" and not dispatch_source.startswith("cloudflare-"):
              print("should_scan=true")
              print("reason=manual_dispatch")
              raise SystemExit
          if event_name == "push":
              print("should_scan=false")
              print("reason=push_deploy_only")
              raise SystemExit

          report = {}
          try:
              base_url = os.environ.get("RADAR_DATA_API_URL", "").rstrip("/")
              with urlopen(f"{base_url}/api/dashboard?history_limit=1", timeout=10) as response:
                  payload = json.load(response)
              if payload.get("ok"):
                  report = payload.get("report") or {}
                  scanner_status = payload.get("scan_status") or {}
          except Exception:
              # A first deployment or temporary Worker outage should trigger a scan,
              # not make Git-tracked runtime JSON the source of truth again.
              report = {}

          try:
              generated_at = scan_freshness_reference(report, targeted) or ""
              generated = datetime.fromisoformat(generated_at.replace("Z", "+00:00"))
              age_seconds = (datetime.now(timezone.utc) - generated).total_seconds()
          except Exception:
              print("should_scan=true")
              print("reason=missing_remote_report")
              raise SystemExit

          try:
              last_attempt = datetime.fromisoformat(
                  str(scanner_status.get("last_attempt_at", "")).replace("Z", "+00:00")
              )
              failed_age_seconds = (datetime.now(timezone.utc) - last_attempt).total_seconds()
              categories = {
                  str(name) for name, count in
                  ((scanner_status.get("scan_health") or {}).get("scan_error_categories", {}) or {}).items()
                  if count
              }
              def persistent(category):
                  return category in {"rate_limit", "quota", "auth", "circuit_open"} or str(category).endswith(
                      ("_rate_limit", "_quota", "_auth", "_circuit_open")
                  )
              underlying = categories - {"rpc_all_unavailable"}
              provider_blocked = scanner_failure_class(scanner_status, 1) == "soft_provider_failure" and (
                  persistent(scanner_status.get("error_category"))
                  or (bool(underlying) and all(persistent(category) for category in underlying))
              )
          except Exception:
              failed_age_seconds = None
              provider_blocked = False

          if (
              scanner_status.get("status") == "failed"
              and provider_blocked
              and failed_age_seconds is not None
              and failed_age_seconds < 6 * 60 * 60
          ):
              print("should_scan=false")
              print(f"reason=provider_backoff_{int(failed_age_seconds)}s")
              raise SystemExit

          if age_seconds < (10 if targeted else 50) * 60:
              print("should_scan=false")
              print(f"reason=fresh_{event_name}_{int(age_seconds)}s")
          else:
              print("should_scan=true")
              print(f"reason=stale_{event_name}_{int(age_seconds)}s")
          PY

      - name: Skip fresh scheduled scan
        if: steps.freshness.outputs.should_scan != 'true'
        run: |
          echo "Skipping scanner because latest report is still fresh: ${{ steps.freshness.outputs.reason }}"

      - name: Restore scanner runtime state
        id: state_restore
        if: steps.freshness.outputs.should_scan == 'true' || steps.plan.outputs.publish_pages == 'true' || steps.plan.outputs.observe_robinhood == 'true' || steps.plan.outputs.recover_storage == 'true'
        uses: actions/cache/restore@v4
        with:
          path: |
            data/state.json
            data/discovery_state.json
            data/discovery_status.json
          key: ${{ runner.os }}-solana-radar-state-v4-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ${{ runner.os }}-solana-radar-state-v4-

      - name: Preserve pending cloud writes
        id: outbox_restore
        if: steps.freshness.outputs.should_scan == 'true' || steps.plan.outputs.recover_runtime == 'true' || steps.plan.outputs.recover_storage == 'true'
        uses: actions/cache/restore@v4
        with:
          path: data/remote_outbox
          key: ${{ runner.os }}-solana-radar-outbox-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ${{ runner.os }}-solana-radar-outbox-v1-

      - name: Record pre-writer runtime revisions
        if: steps.freshness.outputs.should_scan == 'true' || steps.plan.outputs.observe_robinhood == 'true'
        run: python tools/runtime_cache.py capture "$RUNNER_TEMP/radar-runtime-baseline.json"

      - name: Record pre-scan outbox contents
        if: steps.freshness.outputs.should_scan == 'true' || steps.plan.outputs.recover_storage == 'true'
        run: python tools/runtime_cache.py capture-outbox "$RUNNER_TEMP/radar-outbox-baseline.json"

      - name: Restore Python package downloads
        if: steps.freshness.outputs.should_scan == 'true' || steps.plan.outputs.publish_pages == 'true' || steps.plan.outputs.observe_robinhood == 'true' || steps.plan.outputs.validate == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-radar-pip-py311-${{ hashFiles('requirements.txt') }}

      - name: Set up Node
        if: steps.freshness.outputs.should_scan == 'true' || steps.plan.outputs.observe_robinhood == 'true' || steps.plan.outputs.validate == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install Python dependencies
        if: steps.freshness.outputs.should_scan == 'true' || steps.plan.outputs.publish_pages == 'true' || steps.plan.outputs.observe_robinhood == 'true' || steps.plan.outputs.validate == 'true'
        # Download caches are not installed environments. Always install on a new runner.
        run: python -m pip install -r requirements.txt

      - name: Install dashboard test dependencies
        if: steps.plan.outputs.validate == 'true'
        run: npm ci

      - name: Install GMGN CLI when used
        if: steps.freshness.outputs.should_scan == 'true' || steps.plan.outputs.observe_robinhood == 'true'
        env:
          GMGN_API_KEY: ${{ secrets.GMGN_API_KEY }}
        run: |
          if [ -n "$GMGN_API_KEY" ]; then npm install -g gmgn-cli@1.6.1; fi

      - name: Validate scanner and dashboard
        if: steps.plan.outputs.validate == 'true'
        run: |
          python -m unittest discover -s tests -v
          python -m json.tool config.example.json > /dev/null
          node --test cloudflare/scan-dispatcher/test/*.test.mjs dashboard/test/*.test.mjs
          node --check dashboard/app.js

      - name: Recover runtime publication without scanning
        if: steps.plan.outputs.recover_runtime == 'true'
        timeout-minutes: 5
        env:
          RADAR_DATA_API_URL: https://solana-radar-scan-dispatcher.gmirash-solana-radar.workers.dev
          RADAR_INGEST_SECRET: ${{ secrets.RADAR_INGEST_SECRET }}
        run: python tools/recover_runtime_publication.py

      - name: Recover durable storage without scanning
        if: steps.plan.outputs.recover_storage == 'true'
        timeout-minutes: 5
        env:
          RADAR_DATA_API_URL: https://solana-radar-scan-dispatcher.gmirash-solana-radar.workers.dev
          RADAR_INGEST_SECRET: ${{ secrets.RADAR_INGEST_SECRET }}
        run: python tools/recover_storage.py --max-items 25 --max-seconds 180

      - name: Run scanner
        id: run_scanner
        if: steps.freshness.outputs.should_scan == 'true'
        env:
          HELIUS_API_KEY: ${{ secrets.HELIUS_API_KEY }}
          ALCHEMY_SOLANA_RPC_URL: ${{ secrets.ALCHEMY_SOLANA_RPC_URL }}
          ALCHEMY_API_KEY: ${{ secrets.ALCHEMY_API_KEY }}
          CHAINSTACK_SOLANA_RPC_URL: ${{ secrets.CHAINSTACK_SOLANA_RPC_URL }}
          DRPC_SOLANA_RPC_URL: ${{ secrets.DRPC_SOLANA_RPC_URL }}
          DRPC_API_KEY: ${{ secrets.DRPC_API_KEY }}
          PUBLICNODE_SOLANA_RPC_URL: https://solana-rpc.publicnode.com
          GMGN_API_KEY: ${{ secrets.GMGN_API_KEY }}
          BRIGHTDATA_API_KEY: ${{ secrets.BRIGHTDATA_API_KEY }}
          RADAR_DATA_API_URL: https://solana-radar-scan-dispatcher.gmirash-solana-radar.workers.dev
          RADAR_INGEST_SECRET: ${{ secrets.RADAR_INGEST_SECRET }}
          # Live API publication is independent of Pages. Pending writes remain
          # in the outbox; cache is best-effort recovery, not durable SQL ack.
          RADAR_REMOTE_SYNC_REQUIRED: "false"
          SCAN_SOURCE: ${{ inputs.source }}
        run: |
          set +e
          scan_args=()
          # Existing targeted mode omits launch/position-history recovery. Core
          # derived evaluation has no independent skip flag yet.
          if [ "$SCAN_SOURCE" = "cloudflare-targeted" ] || [ "$SCAN_SOURCE" = "manual-targeted" ]; then scan_args+=(--targeted); fi
          timeout --signal=TERM --kill-after=30s 25m python scanner.py --once --lane reactivation "${scan_args[@]}"
          status=$?
          if [ "$status" = "124" ]; then
            python - <<'PY'
          import scanner

          scanner.write_scanner_status(
              "failed",
              error=TimeoutError("scanner exceeded the 25 minute workflow limit"),
          )
          PY
          fi
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          if [ "$status" -ne 0 ]; then
            echo "::warning title=Scanner failed::scanner.py exited with $status; keeping the previous dashboard snapshot"
            {
              echo "### Scanner attempt failed"
              echo ""
              echo "The previous successful dashboard snapshot was kept. See data/scanner_status.json for the current failure reason."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          # Scanner failures are represented in scanner_status.json. Keeping this
          # step green lets the failure be classified, committed, and published below.
          exit 0

      - name: Classify scanner failure
        id: failure_taxonomy
        if: steps.freshness.outputs.should_scan == 'true'
        env:
          SCAN_EXIT_CODE: ${{ steps.run_scanner.outputs.exit_code }}
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import os
          from pathlib import Path
          from scan_failure import scanner_failure_class

          try:
              status = json.loads(Path("data/scanner_status.json").read_text())
          except Exception:
              status = {}
          classification = scanner_failure_class(
              status,
              int(os.environ.get("SCAN_EXIT_CODE") or 1),
          )
          print(f"classification={classification}")
          PY

      - name: Flush bounded SQL history queue after live publication
        id: history_flush
        if: steps.run_scanner.outputs.exit_code == '0' && hashFiles('tools/flush_history_queue.py') != ''
        continue-on-error: true
        timeout-minutes: 2
        env:
          RADAR_DATA_API_URL: ${{ secrets.RADAR_DATA_URL || 'https://solana-radar-scan-dispatcher.gmirash-solana-radar.workers.dev' }}
          RADAR_INGEST_SECRET: ${{ secrets.RADAR_INGEST_SECRET }}
        # Reserved helper contract: at most 10 flushes, 55s internal deadline,
        # 60s outer timeout. Failure must not undo the already-published live data.
        run: timeout --signal=TERM --kill-after=5s 60s python tools/flush_history_queue.py --max-flushes 10 --max-seconds 55

      - name: Check pending cloud write changes
        id: outbox_changes
        if: always() && (steps.freshness.outputs.should_scan == 'true' || steps.plan.outputs.recover_storage == 'true')
        run: python tools/runtime_cache.py check-outbox "$RUNNER_TEMP/radar-outbox-baseline.json" >> "$GITHUB_OUTPUT"

      - name: Save pending cloud writes
        # Keep legacy keys/backlog, including quarantine. Never prune or infer
        # SQL acknowledgement here. A failed comparison or cache miss must save.
        if: always() && (steps.freshness.outputs.should_scan == 'true' || steps.plan.outputs.recover_storage == 'true') && (steps.outbox_changes.outputs.changed != 'false' || steps.outbox_restore.outputs.cache-matched-key == '' || steps.outbox_restore.outcome != 'success')
        uses: actions/cache/save@v4
        with:
          path: data/remote_outbox
          key: ${{ runner.os }}-solana-radar-outbox-v1-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Restore independent Robinhood observations
        if: steps.plan.outputs.observe_robinhood == 'true'
        uses: actions/cache/restore@v4
        with:
          path: |
            data/robinhood.json
            data/robinhood.sqlite
          key: ${{ runner.os }}-robinhood-state-v2-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ${{ runner.os }}-robinhood-state-v2-

      - name: Recover durable Robinhood backup
        id: robinhood_backup
        if: steps.plan.outputs.observe_robinhood == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/restore_robinhood_state.py

      - name: Observe Robinhood mainnet
        id: robinhood
        if: steps.plan.outputs.observe_robinhood == 'true' && steps.robinhood_backup.outcome == 'success'
        timeout-minutes: 10
        continue-on-error: true
        env:
          ROBINHOOD_RPC_URL: ${{ secrets.ROBINHOOD_RPC_URL }}
          ROBINHOOD_ARCHIVE_RPC_URL: ${{ secrets.ROBINHOOD_ARCHIVE_RPC_URL }}
          RELAY_API_KEY: ${{ secrets.RELAY_API_KEY }}
          GMGN_API_KEY: ${{ secrets.GMGN_API_KEY }}
          RADAR_DATA_API_URL: ${{ secrets.RADAR_DATA_URL || 'https://solana-radar-scan-dispatcher.gmirash-solana-radar.workers.dev' }}
          RADAR_INGEST_SECRET: ${{ secrets.RADAR_INGEST_SECRET }}
        # The observer also updates Solana's shared account ledger. It remains
        # hourly/manual, never targeted, and holds the same global writer lock.
        run: python robinhood.py

      - name: Validate failure-safe runtime cache
        id: runtime_cache
        if: always() && (steps.freshness.outputs.should_scan == 'true' || steps.plan.outputs.observe_robinhood == 'true')
        run: python tools/runtime_cache.py validate "$RUNNER_TEMP/radar-runtime-baseline.json" >> "$GITHUB_OUTPUT"

      - name: Save scanner runtime state
        # Save only after every shared ledger writer, including failed observers.
        if: always() && steps.runtime_cache.outputs.valid == 'true' && (steps.runtime_cache.outputs.changed != 'false' || steps.state_restore.outputs.cache-matched-key == '' || steps.state_restore.outcome != 'success')
        uses: actions/cache/save@v4
        with:
          path: |
            data/state.json
            data/discovery_state.json
            data/discovery_status.json
          key: ${{ runner.os }}-solana-radar-state-v4-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Preserve Robinhood observations
        if: steps.robinhood.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: |
            data/robinhood.json
            data/robinhood.sqlite
          key: ${{ runner.os }}-robinhood-state-v2-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Daily Robinhood database backup
        if: steps.robinhood.outcome == 'success' && steps.robinhood.outputs.persisted == 'true' && steps.robinhood_backup.outputs.backup_due == 'true'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: robinhood-state
          path: data/robinhood.sqlite
          retention-days: 14
          compression-level: 9
          if-no-files-found: error

      - name: Build Pages artifact
        id: build_pages
        # Scheduled fallback refreshes occupy 00/06/12/18 UTC deep slots only.
        # Keep original report.generated_at: an older fallback is not live data.
        if: steps.plan.outputs.publish_pages == 'true' && (steps.freshness.outputs.should_scan != 'true' || steps.run_scanner.outputs.exit_code == '0')
        run: |
          git fetch origin main
          publisher=$(mktemp -d "${RUNNER_TEMP:-/tmp}/radar-publisher.XXXXXX")
          trap 'rm -rf "$publisher"' EXIT
          git archive FETCH_HEAD | tar -x -C "$publisher"
          rm -rf .pages
          mkdir -p .pages/data
          cp "$publisher"/dashboard/*.html "$publisher"/dashboard/*.js "$publisher"/dashboard/*.css .pages/
          cp -R "$publisher/dashboard/icons" .pages/
          python "$publisher/tools/build_pages.py"

      - name: Configure Pages
        if: steps.build_pages.outcome == 'success'
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        id: pages_artifact
        if: steps.build_pages.outcome == 'success'
        uses: actions/upload-pages-artifact@v3
        with:
          # A unique name prevents a stale Pages artifact from another queued
          # run being selected by the deployment job.
          name: solana-radar-pages-${{ github.run_id }}
          path: .pages

      - name: Fail hard scanner errors after publishing status
        if: steps.freshness.outputs.should_scan == 'true' && steps.failure_taxonomy.outputs.classification == 'hard_failure'
        run: |
          echo "Scanner failed with a programming, invariant, or corrupted-state error."
          exit 1

  deploy:
    if: always() && github.ref == 'refs/heads/main' && needs.scan.outputs.pages_ready == 'true'
    needs: scan
    runs-on: ubuntu-latest
    concurrency:
      group: solana-radar-pages-deployment
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: solana-radar-pages-${{ github.run_id }}
