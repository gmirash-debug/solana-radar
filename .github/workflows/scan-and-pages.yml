name: Scan and deploy dashboard

on:
  workflow_dispatch:
    inputs:
      source:
        description: "Who triggered the scan"
        required: false
        default: "manual"
  schedule:
    - cron: "37 * * * *"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/scan-and-pages.yml"
      - "scanner.py"
      - "package.json"
      - "package-lock.json"
      - "convex/**"
      - "config.example.json"
      - "config.json"
      - "requirements.txt"
      - "tests/**"
      - "dashboard/**"
      - "data/**"
      - "NARRATIVE_PROTOCOL.md"

concurrency:
  group: solana-radar-scan
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      pages_ready: ${{ steps.pages_artifact.outcome == 'success' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Sync latest main
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git pull --ff-only origin main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check scan freshness
        id: freshness
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import os
          from datetime import datetime, timezone

          event_name = os.environ.get("GITHUB_EVENT_NAME", "")
          if event_name == "workflow_dispatch":
              print("should_scan=true")
              print("reason=manual_dispatch")
              raise SystemExit
          if event_name == "push":
              print("should_scan=false")
              print("reason=push_deploy_only")
              raise SystemExit

          try:
              with open("data/latest_report.json", "r", encoding="utf-8") as handle:
                  report = json.load(handle)
              generated_at = report.get("generated_at", "")
              generated = datetime.fromisoformat(generated_at.replace("Z", "+00:00"))
              age_seconds = (datetime.now(timezone.utc) - generated).total_seconds()
          except Exception:
              print("should_scan=true")
              print("reason=missing_report")
              raise SystemExit

          if age_seconds < 50 * 60:
              print("should_scan=false")
              print(f"reason=fresh_{event_name}_{int(age_seconds)}s")
          else:
              print("should_scan=true")
              print(f"reason=stale_{event_name}_{int(age_seconds)}s")
          PY

      - name: Skip fresh scheduled scan
        if: steps.freshness.outputs.should_scan != 'true'
        run: |
          echo "Skipping scanner because latest report is still fresh: ${{ steps.freshness.outputs.reason }}"

      - name: Install dependencies
        if: steps.freshness.outputs.should_scan == 'true' || github.event_name == 'push'
        run: |
          python -m pip install -r requirements.txt
          npm install -g gmgn-cli

      - name: Validate scanner and dashboard
        if: steps.freshness.outputs.should_scan == 'true' || github.event_name == 'push'
        run: |
          python -m unittest discover -s tests -v
          python -m json.tool config.example.json > /dev/null
          node --check dashboard/app.js

      - name: Run scanner
        id: run_scanner
        if: steps.freshness.outputs.should_scan == 'true'
        env:
          HELIUS_API_KEY: ${{ secrets.HELIUS_API_KEY }}
          SOLANA_TRACKER_API_KEY: ${{ secrets.SOLANA_TRACKER_API_KEY }}
          GMGN_API_KEY: ${{ secrets.GMGN_API_KEY }}
          BRIGHTDATA_API_KEY: ${{ secrets.BRIGHTDATA_API_KEY }}
        run: |
          set +e
          python scanner.py --once --lane all
          status=$?
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          if [ "$status" -ne 0 ]; then
            echo "::warning title=Scanner failed::scanner.py exited with $status; keeping the previous dashboard snapshot"
          fi
          exit 0

      - name: Commit scanner data
        if: steps.freshness.outputs.should_scan == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/scanner_status.json
          if [ "${{ steps.run_scanner.outputs.exit_code }}" = "0" ]; then
            git add data/latest_report.json data/latest_report.md data/alerts.jsonl data/state.json data/deleted_tokens.json
          fi
          if ! git diff --cached --quiet; then
            if [ "${{ steps.run_scanner.outputs.exit_code }}" = "0" ]; then
              git commit -m "Update scanner data"
            else
              git commit -m "Record scanner failure"
            fi
            for attempt in 1 2 3; do
              if git pull --rebase origin "$GITHUB_REF_NAME" && git push origin "HEAD:$GITHUB_REF_NAME"; then
                break
              fi
              if [ "$attempt" = "3" ]; then
                exit 1
              fi
              git rebase --abort || true
              sleep 5
            done
          fi

      - name: Build Pages artifact
        if: steps.freshness.outputs.should_scan == 'true' || github.event_name == 'push'
        run: |
          rm -rf .pages
          mkdir -p .pages/data
          cp dashboard/index.html dashboard/app.js dashboard/styles.css dashboard/config.js .pages/
          cp data/latest_report.json data/latest_report.md data/alerts.jsonl data/scanner_status.json .pages/data/
          if [ -f data/deleted_tokens.json ]; then
            cp data/deleted_tokens.json .pages/data/
          else
            printf '{"tokens":[],"pools":[],"entries":{},"updated_at":null}\n' > .pages/data/deleted_tokens.json
          fi
          python3 - <<'PY'
          import json
          from pathlib import Path

          state = json.loads(Path("data/state.json").read_text())
          public_state = {
              "market": state.get("market", {}),
          }
          Path(".pages/data/state.json").write_text(json.dumps(public_state, separators=(",", ":")))
          PY

      - name: Configure Pages
        if: steps.freshness.outputs.should_scan == 'true' || github.event_name == 'push'
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        id: pages_artifact
        if: steps.freshness.outputs.should_scan == 'true' || github.event_name == 'push'
        uses: actions/upload-pages-artifact@v3
        with:
          path: .pages

  deploy:
    if: github.ref == 'refs/heads/main' && needs.scan.outputs.pages_ready == 'true'
    needs: scan
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
