name: Scan and deploy dashboard

on:
  workflow_dispatch:
    inputs:
      source:
        description: "Who triggered the scan"
        required: false
        default: "manual"
  schedule:
    - cron: "37 * * * *"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/scan-and-pages.yml"
      - "scanner.py"
      - "package.json"
      - "package-lock.json"
      - "convex/**"
      - "config.example.json"
      - "config.json"
      - "requirements.txt"
      - "tests/**"
      - "dashboard/**"
      - "NARRATIVE_PROTOCOL.md"

concurrency:
  group: solana-radar-scan
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    outputs:
      pages_ready: ${{ steps.pages_artifact.outcome == 'success' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Sync latest main
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git pull --ff-only origin main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check scan freshness
        id: freshness
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import os
          from datetime import datetime, timezone

          event_name = os.environ.get("GITHUB_EVENT_NAME", "")
          event = {}
          scanner_status = {}
          try:
              with open(os.environ.get("GITHUB_EVENT_PATH", ""), "r", encoding="utf-8") as handle:
                  event = json.load(handle)
          except Exception:
              pass
          dispatch_source = (event.get("inputs") or {}).get("source", "")
          if event_name == "workflow_dispatch" and dispatch_source not in ("cloudflare-cron",):
              print("should_scan=true")
              print("reason=manual_dispatch")
              raise SystemExit
          if event_name == "push":
              print("should_scan=false")
              print("reason=push_deploy_only")
              raise SystemExit

          try:
              with open("data/latest_report.json", "r", encoding="utf-8") as handle:
                  report = json.load(handle)
              generated_at = report.get("generated_at", "")
              generated = datetime.fromisoformat(generated_at.replace("Z", "+00:00"))
              age_seconds = (datetime.now(timezone.utc) - generated).total_seconds()
          except Exception:
              print("should_scan=true")
              print("reason=missing_report")
              raise SystemExit

          try:
              with open("data/scanner_status.json", "r", encoding="utf-8") as handle:
                  scanner_status = json.load(handle)
              last_attempt = datetime.fromisoformat(
                  str(scanner_status.get("last_attempt_at", "")).replace("Z", "+00:00")
              )
              failed_age_seconds = (datetime.now(timezone.utc) - last_attempt).total_seconds()
              error_categories = (
                  scanner_status.get("scan_health", {}).get("scan_error_categories", {})
              )
              status_error = str(scanner_status.get("error") or "").lower()
              provider_blocked = any(
                  error_categories.get(key)
                  for key in ("rpc_all_unavailable",)
              ) or any(
                  marker in status_error
                  for marker in (
                      "all rpc provider",
                      "max usage",
                      "rate_limit",
                      "rate limit",
                      "quota",
                      "credit",
                      "http 401",
                      "http 403",
                      "unauthorized",
                      "forbidden",
                      "invalid api key",
                      "api_key is missing",
                      "api key is missing",
                      "missing api key",
                      "auth:",
                  )
              )
          except Exception:
              failed_age_seconds = None
              provider_blocked = False

          if (
              scanner_status.get("status") == "failed"
              and provider_blocked
              and failed_age_seconds is not None
              and failed_age_seconds < 6 * 60 * 60
          ):
              print("should_scan=false")
              print(f"reason=provider_backoff_{int(failed_age_seconds)}s")
              raise SystemExit

          if age_seconds < 50 * 60:
              print("should_scan=false")
              print(f"reason=fresh_{event_name}_{int(age_seconds)}s")
          else:
              print("should_scan=true")
              print(f"reason=stale_{event_name}_{int(age_seconds)}s")
          PY

      - name: Skip fresh scheduled scan
        if: steps.freshness.outputs.should_scan != 'true'
        run: |
          echo "Skipping scanner because latest report is still fresh: ${{ steps.freshness.outputs.reason }}"

      - name: Restore scanner runtime state
        if: steps.freshness.outputs.should_scan == 'true'
        uses: actions/cache/restore@v4
        with:
          path: data/state.json
          key: ${{ runner.os }}-solana-radar-state-v3-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-solana-radar-state-v3-

      - name: Install dependencies
        if: steps.freshness.outputs.should_scan == 'true' || github.event_name == 'push'
        run: |
          python -m pip install -r requirements.txt
          npm ci
          npm install -g gmgn-cli@1.5.4

      - name: Validate scanner and dashboard
        if: steps.freshness.outputs.should_scan == 'true' || github.event_name == 'push'
        run: |
          python -m unittest discover -s tests -v
          python -m json.tool config.example.json > /dev/null
          node --check dashboard/app.js
          npx tsc -p convex/tsconfig.json --noEmit

      - name: Configure and deploy Convex
        if: github.event_name == 'push'
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
          CONVEX_INGEST_SECRET: ${{ secrets.CONVEX_INGEST_SECRET }}
        run: |
          printf '%s' "$CONVEX_INGEST_SECRET" | npx convex env set --prod CONVEX_INGEST_SECRET
          npx convex env list --prod --names-only | grep -qx CONVEX_INGEST_SECRET
          npx convex deploy

      - name: Verify Convex production
        if: github.event_name == 'push'
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
        run: |
          response="$(
            curl --fail-with-body --silent --show-error \
              --request POST \
              --header 'Content-Type: application/json' \
              --data '{"path":"radar:dashboardData","args":{"historyLimit":1},"format":"json"}' \
              https://basic-starfish-944.convex.cloud/api/query
          )"
          if ! printf '%s' "$response" | python -c \
            'import json, sys; raise SystemExit(0 if json.load(sys.stdin).get("status") == "success" else 1)'
          then
            echo "::error title=Convex smoke test failed::$response"
            timeout --signal=TERM 20s npx convex logs --prod --history 40 || true
            exit 1
          fi
          echo "Convex production query is healthy."

      - name: Run scanner
        id: run_scanner
        if: steps.freshness.outputs.should_scan == 'true'
        env:
          HELIUS_API_KEY: ${{ secrets.HELIUS_API_KEY }}
          ALCHEMY_SOLANA_RPC_URL: ${{ secrets.ALCHEMY_SOLANA_RPC_URL }}
          ALCHEMY_API_KEY: ${{ secrets.ALCHEMY_API_KEY }}
          CHAINSTACK_SOLANA_RPC_URL: ${{ secrets.CHAINSTACK_SOLANA_RPC_URL }}
          GMGN_API_KEY: ${{ secrets.GMGN_API_KEY }}
          BRIGHTDATA_API_KEY: ${{ secrets.BRIGHTDATA_API_KEY }}
          CONVEX_URL: https://basic-starfish-944.convex.cloud
          CONVEX_INGEST_SECRET: ${{ secrets.CONVEX_INGEST_SECRET }}
          # The Actions cache and static Pages snapshot keep the hourly scan
          # operational during a temporary Convex outage.
          CONVEX_SYNC_REQUIRED: "false"
        run: |
          set +e
          timeout --signal=TERM --kill-after=30s 25m python scanner.py --once --lane reactivation
          status=$?
          if [ "$status" = "124" ]; then
            python - <<'PY'
          import scanner

          scanner.write_scanner_status(
              "failed",
              error=TimeoutError("scanner exceeded the 25 minute workflow limit"),
          )
          PY
          fi
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          if [ "$status" -ne 0 ]; then
            echo "::warning title=Scanner failed::scanner.py exited with $status; keeping the previous dashboard snapshot"
            {
              echo "### Scanner attempt failed"
              echo ""
              echo "The previous successful dashboard snapshot was kept. See data/scanner_status.json for the current failure reason."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          # Scanner failures are represented in scanner_status.json. Keeping this
          # step green prevents an hourly provider outage from sending failure mail.
          exit 0

      - name: Commit scanner data
        if: steps.freshness.outputs.should_scan == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp data/state.json /tmp/solana-radar-runtime-state.json
          git restore --worktree -- data/state.json
          if [ "${{ steps.run_scanner.outputs.exit_code }}" != "0" ]; then
            cp data/scanner_status.json /tmp/scanner_status.json
            git restore --worktree -- data/latest_report.json data/latest_report.md data/alerts.jsonl data/deleted_tokens.json
            cp /tmp/scanner_status.json data/scanner_status.json
          fi
          git add data/scanner_status.json
          if [ "${{ steps.run_scanner.outputs.exit_code }}" = "0" ]; then
            git add data/latest_report.json data/latest_report.md data/alerts.jsonl data/deleted_tokens.json
          fi
          if ! git diff --cached --quiet; then
            if [ "${{ steps.run_scanner.outputs.exit_code }}" = "0" ]; then
              git commit -m "Update scanner data"
            else
              git commit -m "Record scanner failure"
            fi
            for attempt in 1 2 3; do
              if git pull --rebase origin "$GITHUB_REF_NAME" && git push origin "HEAD:$GITHUB_REF_NAME"; then
                break
              fi
              if [ "$attempt" = "3" ]; then
                exit 1
              fi
              git rebase --abort || true
              sleep 5
            done
          fi
          cp /tmp/solana-radar-runtime-state.json data/state.json

      - name: Save scanner runtime state
        if: steps.freshness.outputs.should_scan == 'true' && steps.run_scanner.outputs.exit_code == '0'
        uses: actions/cache/save@v4
        with:
          path: data/state.json
          key: ${{ runner.os }}-solana-radar-state-v3-${{ github.run_id }}

      - name: Build Pages artifact
        if: steps.freshness.outputs.should_scan == 'true' || github.event_name == 'push'
        run: |
          rm -rf .pages
          mkdir -p .pages/data
          cp dashboard/index.html dashboard/app.js dashboard/styles.css dashboard/config.js .pages/
          cp data/latest_report.json data/latest_report.md data/alerts.jsonl data/scanner_status.json .pages/data/
          if [ -f data/deleted_tokens.json ]; then
            cp data/deleted_tokens.json .pages/data/
          else
            printf '{"tokens":[],"pools":[],"entries":{},"updated_at":null}\n' > .pages/data/deleted_tokens.json
          fi
          python3 - <<'PY'
          import json
          from pathlib import Path

          state = json.loads(Path("data/state.json").read_text())
          public_state = {
              "market": state.get("market", {}),
          }
          Path(".pages/data/state.json").write_text(json.dumps(public_state, separators=(",", ":")))
          PY

      - name: Configure Pages
        if: steps.freshness.outputs.should_scan == 'true' || github.event_name == 'push'
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        id: pages_artifact
        if: steps.freshness.outputs.should_scan == 'true' || github.event_name == 'push'
        uses: actions/upload-pages-artifact@v3
        with:
          path: .pages

  deploy:
    if: github.ref == 'refs/heads/main' && needs.scan.outputs.pages_ready == 'true'
    needs: scan
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
