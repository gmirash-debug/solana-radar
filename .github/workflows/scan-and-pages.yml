name: Scan and deploy dashboard

on:
  workflow_dispatch:
  schedule:
    - cron: "17,47 * * * *"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/scan-and-pages.yml"
      - "scanner.py"
      - "config.example.json"
      - "config.json"
      - "requirements.txt"
      - "dashboard/**"
      - "data/**"
      - "NARRATIVE_PROTOCOL.md"

concurrency:
  group: solana-radar-scan
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  scan:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check scan freshness
        id: freshness
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import os
          from datetime import datetime, timezone

          event_name = os.environ.get("GITHUB_EVENT_NAME", "")
          if event_name != "schedule":
              print("should_scan=true")
              print("reason=non_schedule")
              raise SystemExit

          try:
              with open("data/latest_report.json", "r", encoding="utf-8") as handle:
                  report = json.load(handle)
              generated_at = report.get("generated_at", "")
              generated = datetime.fromisoformat(generated_at.replace("Z", "+00:00"))
              age_seconds = (datetime.now(timezone.utc) - generated).total_seconds()
          except Exception:
              print("should_scan=true")
              print("reason=missing_report")
              raise SystemExit

          if age_seconds < 50 * 60:
              print("should_scan=false")
              print(f"reason=fresh_{int(age_seconds)}s")
          else:
              print("should_scan=true")
              print(f"reason=stale_{int(age_seconds)}s")
          PY

      - name: Skip fresh scheduled scan
        if: steps.freshness.outputs.should_scan != 'true'
        run: echo "Skipping scanner because latest report is still fresh: ${{ steps.freshness.outputs.reason }}"

      - name: Install dependencies
        if: steps.freshness.outputs.should_scan == 'true'
        run: python -m pip install -r requirements.txt

      - name: Run scanner
        if: steps.freshness.outputs.should_scan == 'true'
        env:
          HELIUS_API_KEY: ${{ secrets.HELIUS_API_KEY }}
          SOLANA_TRACKER_API_KEY: ${{ secrets.SOLANA_TRACKER_API_KEY }}
          BRIGHTDATA_API_KEY: ${{ secrets.BRIGHTDATA_API_KEY }}
        run: python scanner.py --once --lane all

      - name: Commit scanner data
        if: steps.freshness.outputs.should_scan == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/latest_report.json data/latest_report.md data/alerts.jsonl data/state.json
          if ! git diff --cached --quiet; then
            git commit -m "Update scanner data"
            git push
          fi

      - name: Build Pages artifact
        if: steps.freshness.outputs.should_scan == 'true'
        run: |
          rm -rf .pages
          mkdir -p .pages/data
          cp dashboard/index.html dashboard/app.js dashboard/styles.css .pages/
          cp data/latest_report.json data/latest_report.md data/alerts.jsonl data/state.json .pages/data/

      - name: Configure Pages
        if: steps.freshness.outputs.should_scan == 'true'
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        if: steps.freshness.outputs.should_scan == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: .pages

      - name: Deploy Pages
        if: steps.freshness.outputs.should_scan == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
