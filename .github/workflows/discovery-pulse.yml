name: Reactivation discovery pulse

on:
  workflow_dispatch:
    inputs:
      source:
        description: "Who triggered discovery"
        required: false
        default: "manual"
      dispatch_bucket:
        description: "Cloudflare scheduler bucket"
        required: false
        default: "manual"
  schedule:
    - cron: "*/5 * * * *"

concurrency:
  # Shared lock with the hourly deep scan: never overwrite a newer state cache.
  group: solana-radar-state-writer
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  discovery:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Restore shared scanner state
        uses: actions/cache/restore@v4
        with:
          path: |
            data/state.json
            data/discovery_state.json
            data/discovery_status.json
          key: ${{ runner.os }}-solana-radar-state-v4-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-solana-radar-state-v4-

      - name: Skip duplicate scheduled pulse
        id: freshness
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import os
          from datetime import datetime, timezone

          event_name = os.environ.get("GITHUB_EVENT_NAME", "")
          event = {}
          try:
              with open(os.environ.get("GITHUB_EVENT_PATH", ""), "r", encoding="utf-8") as handle:
                  event = json.load(handle)
          except Exception:
              pass
          inputs = event.get("inputs") or {}
          source = str(inputs.get("source") or "")
          if event_name == "workflow_dispatch" and source not in ("cloudflare-discovery",):
              print("should_run=true")
              print("reason=manual_dispatch")
              raise SystemExit
          try:
              with open("data/discovery_status.json", "r", encoding="utf-8") as handle:
                  status = json.load(handle)
              last_success = datetime.fromisoformat(
                  str(status.get("last_success_at", "")).replace("Z", "+00:00")
              )
              age_seconds = (datetime.now(timezone.utc) - last_success).total_seconds()
          except Exception:
              age_seconds = None
          if age_seconds is not None and age_seconds < 4 * 60:
              print("should_run=false")
              print(f"reason=fresh_discovery_{int(age_seconds)}s")
          else:
              print("should_run=true")
              print("reason=scheduled_or_cloudflare")
          PY

      - name: Skip fresh scheduled pulse
        if: steps.freshness.outputs.should_run != 'true'
        run: |
          echo "Skipping duplicate discovery pulse: ${{ steps.freshness.outputs.reason }}"

      - name: Install discovery dependencies
        if: steps.freshness.outputs.should_run == 'true'
        run: |
          python -m pip install -r requirements.txt
          npm install -g gmgn-cli@1.5.4

      - name: Refresh discovery baselines
        id: discovery_pulse
        if: steps.freshness.outputs.should_run == 'true'
        env:
          GMGN_API_KEY: ${{ secrets.GMGN_API_KEY }}
          RADAR_DATA_API_URL: https://solana-radar-scan-dispatcher.gmirash-solana-radar.workers.dev
          RADAR_INGEST_SECRET: ${{ secrets.RADAR_INGEST_SECRET }}
          RADAR_REMOTE_SYNC_REQUIRED: "false"
        run: |
          set +e
          timeout --signal=TERM --kill-after=15s 6m python scanner.py --discovery-only
          status=$?
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          if [ "$status" -ne 0 ]; then
            echo "::warning title=Discovery pulse failed::Exit code $status. The hourly scanner will continue with the last persisted baseline."
          fi
          exit 0

      - name: Save shared scanner state
        if: steps.freshness.outputs.should_run == 'true' && steps.discovery_pulse.outputs.exit_code == '0'
        uses: actions/cache/save@v4
        with:
          path: |
            data/state.json
            data/discovery_state.json
            data/discovery_status.json
          key: ${{ runner.os }}-solana-radar-state-v4-${{ github.run_id }}
