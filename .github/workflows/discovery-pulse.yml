name: Reactivation discovery pulse

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

concurrency:
  # Shared lock with the hourly deep scan: never overwrite a newer state cache.
  group: solana-radar-state-writer
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  discovery:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Restore shared scanner state
        uses: actions/cache/restore@v4
        with:
          path: |
            data/state.json
            data/discovery_status.json
          key: ${{ runner.os }}-solana-radar-state-v4-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-solana-radar-state-v4-

      - name: Install discovery dependencies
        run: |
          python -m pip install -r requirements.txt
          npm install -g gmgn-cli@1.5.4

      - name: Refresh discovery baselines
        id: discovery_pulse
        env:
          GMGN_API_KEY: ${{ secrets.GMGN_API_KEY }}
        run: |
          set +e
          timeout --signal=TERM --kill-after=15s 6m python scanner.py --discovery-only
          status=$?
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          if [ "$status" -ne 0 ]; then
            echo "::warning title=Discovery pulse failed::Exit code $status. The hourly scanner will continue with the last persisted baseline."
          fi
          exit 0

      - name: Save shared scanner state
        if: steps.discovery_pulse.outputs.exit_code == '0'
        uses: actions/cache/save@v4
        with:
          path: |
            data/state.json
            data/discovery_status.json
          key: ${{ runner.os }}-solana-radar-state-v4-${{ github.run_id }}
