name: Scan scheduler safety net

on:
  schedule:
    - cron: "43 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: solana-radar-watchdog
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Dispatch only when the primary scheduler left scans stale
        env:
          GH_TOKEN: ${{ github.token }}
        # Stdlib-only helper uses the hosted Ubuntu Python; no dependency install.
        run: python3 tools/scan_watchdog.py
