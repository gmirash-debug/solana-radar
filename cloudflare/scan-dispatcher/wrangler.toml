name = "solana-radar-scan-dispatcher"
main = "src/index.js"
compatibility_date = "2026-05-13"

[triggers]
crons = ["*/5 * * * *", "7 * * * *", "37 * * * *", "22,37,52 * * * *", "47 * * * *"]

[[durable_objects.bindings]]
name = "DISPATCH_BUCKETS"
class_name = "DispatchBuckets"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["DispatchBuckets"]

[[durable_objects.bindings]]
name = "RUNTIME_SNAPSHOTS"
class_name = "RuntimeSnapshots"

[[migrations]]
tag = "v2"
new_sqlite_classes = ["RuntimeSnapshots"]

[[durable_objects.bindings]]
name = "HISTORY_QUEUE"
class_name = "HistoryQueue"

[[migrations]]
tag = "v3"
new_sqlite_classes = ["HistoryQueue"]

[[durable_objects.bindings]]
name = "R2_BUDGET"
class_name = "R2Budget"

[[migrations]]
tag = "v4"
new_sqlite_classes = ["R2Budget"]

[vars]
GITHUB_OWNER = "gmirash-debug"
GITHUB_REPO = "solana-radar"
GITHUB_WORKFLOW = "scan-and-pages.yml"
GITHUB_DISCOVERY_WORKFLOW = "discovery-pulse.yml"
GITHUB_REF = "main"
ALLOWED_ORIGIN = "https://gmirash-debug.github.io"
SCHEDULER_ENABLED = "auto"
HISTORY_FLUSH_CRON = "37 * * * *"
# Release-specific deferred migration. Other versions are deliberately rejected.
HISTORY_SCHEMA_AUTO_UPGRADE = "0003_resumable_history.sql"
STORAGE_SQL_BACKEND = "turso"
RUNTIME_STORAGE_BACKEND = "turso_sql"
RUNTIME_LEGACY_READ = "enabled"
HISTORY_QUEUE_BACKEND = "turso_sql"
# Canonical history/resume state was verified before enabling this cutover.
# New events stage separately until the read-only DO sweep completes.
HISTORY_LEGACY_MIGRATION = "verified_turso_v1"
TURSO_DATABASE_URL = "libsql://solana-radar-gmirash-debug.aws-eu-west-1.turso.io"
HISTORY_ARCHIVE_MODE = "r2"
RUNTIME_ARCHIVE_MODE = "r2"
R2_BUDGET_GUARD = "enabled"
HISTORY_DERIVED_MODE = "daily"
# Estimated queue work only; leave room for daily Learning and operational SQL.
HISTORY_QUEUE_DAILY_HIST_WRITE_UNITS = "180000"
# Turso calls are external requests; share the free invocation cap with Learning.
HISTORY_QUEUE_FLUSH_QUERIES = "24"
# Preserve free DO write headroom for operational state and the R2 guard.
HISTORY_QUEUE_DAILY_WRITE_UNITS = "15000"

# Retained for an explicit rollback; the Turso adapter does not write to D1.
[[d1_databases]]
binding = "RADAR_DB"
database_name = "solana-radar"
database_id = "cf245cb3-475b-4fda-8831-70b7c8a0d672"

[[d1_databases]]
binding = "RADAR_HISTORY_DB"
database_name = "solana-radar-history"
database_id = "41d38b04-c3ae-41c0-aa80-1bcb2f0dead4"
migrations_dir = "migrations-history"

[[r2_buckets]]
binding = "RADAR_ARCHIVE"
bucket_name = "solana-radar-archive"
