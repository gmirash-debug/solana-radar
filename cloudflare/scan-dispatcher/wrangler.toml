name = "solana-radar-scan-dispatcher"
main = "src/index.js"
compatibility_date = "2026-05-13"

[triggers]
crons = ["*/5 * * * *", "7 * * * *", "37 * * * *", "22,37,52 * * * *"]

[[durable_objects.bindings]]
name = "DISPATCH_BUCKETS"
class_name = "DispatchBuckets"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["DispatchBuckets"]

[[durable_objects.bindings]]
name = "RUNTIME_SNAPSHOTS"
class_name = "RuntimeSnapshots"

[[migrations]]
tag = "v2"
new_sqlite_classes = ["RuntimeSnapshots"]

[[durable_objects.bindings]]
name = "HISTORY_QUEUE"
class_name = "HistoryQueue"

[[migrations]]
tag = "v3"
new_sqlite_classes = ["HistoryQueue"]

[vars]
GITHUB_OWNER = "gmirash-debug"
GITHUB_REPO = "solana-radar"
GITHUB_WORKFLOW = "scan-and-pages.yml"
GITHUB_DISCOVERY_WORKFLOW = "discovery-pulse.yml"
GITHUB_REF = "main"
ALLOWED_ORIGIN = "https://gmirash-debug.github.io"
SCHEDULER_ENABLED = "auto"
HISTORY_FLUSH_CRON = "37 * * * *"
# Release-specific deferred migration. Other versions are deliberately rejected.
HISTORY_SCHEMA_AUTO_UPGRADE = "0003_resumable_history.sql"

# Create the database before the first production deploy, then replace this id.
[[d1_databases]]
binding = "RADAR_DB"
database_name = "solana-radar"
database_id = "cf245cb3-475b-4fda-8831-70b7c8a0d672"

[[d1_databases]]
binding = "RADAR_HISTORY_DB"
database_name = "solana-radar-history"
database_id = "41d38b04-c3ae-41c0-aa80-1bcb2f0dead4"
migrations_dir = "migrations-history"

# Raw transaction and provider payloads are optional. The account has not
# enabled R2 yet, so do not add an active binding until the bucket exists.
# Once enabled, create `solana-radar-archive` and add:
# [[r2_buckets]]
# binding = "RADAR_ARCHIVE"
# bucket_name = "solana-radar-archive"
